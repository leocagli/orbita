[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.dependencies]
# OpenZeppelin Stellar 0.7.2 compila contra soroban-sdk 26.1.0: mantenerlos alineados.
soroban-sdk = "26.1.0"
stellar-access = "=0.7.2"
stellar-macros = "=0.7.2"
stellar-tokens = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://developers.stellar.org/docs/build/smart-contracts/example-contracts/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
